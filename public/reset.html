<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password — Kryptex</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/">K<span>R</span>YPTEX</a></header><main class="reset-wrap"><section class="card"><h2>Set a new password</h2><p class="muted">Choose a new password for your account.</p><form id="resetForm"><input id="newPass" type="password" minlength="10" placeholder="New password (10+ characters)" required><button class="primary">Update password →</button><p id="resetMsg" class="message"></p></form></section></main><script>document.getElementById('resetForm').addEventListener('submit',async e=>{e.preventDefault();const token=new URLSearchParams(location.search).get('token');const r=await fetch('/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:document.getElementById('newPass').value})});const d=await r.json();document.getElementById('resetMsg').textContent=d.error||'Password updated. You can now sign in.';});</script></body></html>
